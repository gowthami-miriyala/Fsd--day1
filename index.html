<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details D</title>
    <link rel="stylesheet" href="index.css">
    
</head>
<body>
    <h1 style="text-align: center;">Student Details</h1>
    <form style="text-align:left;">
        <tabel>
            <tr>
        <label for="fname">Firstname:</label><br>
        <input type="text" id="fname" name="fname" placeholder=" enter firstname"><br>
        <label for="lname">Lastname</label><br>
        <input type="text" id="lname" name="lname" placeholder=" enter lastname"><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" namr="email" placeholder="enter email"><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" placeholder="enter password"><br>
        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" placeholder=" enter phone number" pattern="[0-9]{10}"><br>
        <label for="gender">Gender:</label><br>
        <input type="radio" id="male" name="gender">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender">

        <input type="radio" id="other" name="gender">

        <input type="radio" id="no" name="no" >

        <label for="date of birth:">Date of birth</label><br>
        <input type="date" id="date of birth" name="date of birth"><br>

        </select><br>

            <option value="Gujarat">Gujarat</option>
            <option value="Haryana">Haryana</option>
            <option value="Himachal Pradesh">Himachal Pradesh</option>
            <option value="Jharkhand">Jharkhand</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Kerala">Kerala</option>
            <option value="Maharastra">Maharasthra</option>
            <option value="Madhya Pradesh">Madhya Pradesh</option>
            <option value="Manipur">Manipur</option>
            <option value="Megaland">Meghalaya</option>
            <option value="Mizaram">Mizaram</option>
            <option value="Nagaland">Nagaland</option>
            <option value="Odisha">Odisha</option>
            <option value="Punjab">Punjab</option>
            <option value="Rajasthan">Rajasthan</option>
            <option value="Sikkim">Sikkim</option>
            <option value="Tripura">Tripura</option>
            <option value="Telengana">Telangana</option>
            <option value="Uttar Pradesh">Uttar Pradesh</option>
            <option value="Uttarkahand">Uttarkhand</option>
            <option value="West Bengal">West Bengal</option>
            <option value="Andaman & Nicobar">Andaman & Nicobar</option>
            <option value="Chandigrah">Chandigarh</option>
            <option value="Dadra & Nagar Havali">Dadra & Nagar Havali</option>
            <option value="Jammu and Kashmir">Jammu and Kashmir</option>
            <option value="Lakshadweep">Lakshadweep</option>
            <option value="Ladakh">Ladakh </option>
            <option value="Puducherry">Puducherry</option>
        </select><br>
        <label for="disignation">Disignation:</label><br>
        <select id="disignation" name="Disignation">
            <option value="B.Tech">B.Tech</B></option>
            <option value="Degree">Degree</option>
            <option value="M.B.A">M.B.A</option>
            <option value="M.C.A">M.C.A</option>
        </select><br>
        <label for="course">Course</label><br>
        <select id="course" name="course">
            <option value="CSE">CSE</option>
            <option value="CSE-AIML">CSE-AIML</option>
            <option value="CSE-DS">CSE-DS</option>
            <option value="IT">IT</option>
            <option value="IOT">IOT</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="MECH">MECH</option>
            <option value="CIVIL">CIVIL</option>
        </select><br>
        <label for="pin">Pincede:</label><br>
        <input type="tel" id="pincode" namr="pincode" pattern="[0-9]{6}"><br>
        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" namr="phonenumber" pattern="[0-9]{10}"><br>
        <label for="image">Student Profile:</label><br>
        <input type="file" id="image" name="image" ><br>

        <label for="address">Address:</label><br>

        <input type="checkbox" id="agree" name="igree">

        <input type="submit" id="submit" value="SUBMIT"><br>

     </form>
